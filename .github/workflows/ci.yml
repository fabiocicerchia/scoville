name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          # Dev dependencies come from a hash-pinned lockfile; the package
          # itself installs with --no-deps so nothing unpinned sneaks in.
          # Regenerate after touching pyproject.toml:
          #   uv pip compile pyproject.toml --extra dev --generate-hashes \
          #     --universal -p 3.11 -o requirements-dev.txt
          pip install --require-hashes -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Pytest
        run: pytest -q

      # FC-PY-003. Runs here rather than in pre-commit because a type checker
      # with no dependencies installed reports every import as unresolved and
      # every value that came through one as unknown -- noise that says nothing
      # about this code.
      - name: Basedpyright
        run: basedpyright

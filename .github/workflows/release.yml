name: release

# release-please reads Conventional Commit messages on main and keeps an open
# "chore: release X.Y.Z" PR that bumps the version in pyproject.toml and updates
# CHANGELOG.md. Merging that PR (and only that) creates the vX.Y.Z tag and a
# *draft* GitHub Release; this workflow then attaches the sdist/wheel and
# publishes it.
#
# The draft is not optional. Releases in this org are immutable, so assets can
# only be uploaded while the release is still a draft — publish first and the
# upload is rejected. That is why this uses manifest mode
# (release-please-config.json, "draft": true): the action has no `draft` input,
# so an inline `release-type:` cannot ask for one.
#
# Why this is two release-please jobs and not one — do not collapse them back:
# a draft release has no git tag, publishing it is what creates the tag. A
# single invocation cuts the release and then computes the next release PR in
# the same run, while the release is still a draft — so there is no tag for the
# version already in .release-please-manifest.json, release-please loses its
# anchor, walks the entire history and opens a PR re-releasing everything.
# Merging that cuts another release, which opens another PR, forever. So:
#
#   release-please  phase 1 — cut the draft release only
#   build           attach the sdist/wheel, publish the draft -> tag exists
#   release-pr      phase 2 — open/update the next release PR only
#
# PyPI is opt-in: configure a Trusted Publisher for this repo on pypi.org
# (workflow: release.yml, environment: pypi) and set the repository variable
# PUBLISH_TO_PYPI to "true".
#
# The container image goes to ghcr.io/<owner>/<repo> on every release, tagged
# vX.Y.Z, vX.Y and latest. That needs no configuration at all — see the `docker`
# job.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags & the draft release
      pull-requests: write # open/update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach assets to the draft, then publish it
    steps:
      # `ref: <tag>` would fail here: while the release is a draft its tag ref
      # does not exist yet. The push being built is the release commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          pip install --require-hashes -r requirements-dev.txt
          python -m build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

      - name: Attach artifacts to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

  pypi:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true' && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing — no long-lived token
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  # The container image. Unlike PyPI this needs no external setup and so is not
  # opt-in: GHCR authenticates with the workflow's own GITHUB_TOKEN, and
  # `packages: write` is the whole credential.
  #
  # It runs after `build` so a release that never got published cannot leave a
  # tagged image behind pointing at it.
  docker:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      # Same reason as `build`: the tag ref may not have existed when this
      # workflow started, so build the release commit itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}

      # arm64 is emulated. scoville is pure Python, so the cost of that is a
      # slow `pip install`, not a cross-compile.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # `value:` is explicit because the tag ref is not what triggered this
          # run — the push to main is.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.licenses=Apache-2.0

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attestations ride along in the registry, so this stays within
          # `packages: write` — no id-token needed.
          provenance: mode=max
          sbom: true

  # Phase 2 — open/update the next release PR, now that `build` has published
  # the draft and the tag exists. `always()` because on an ordinary push no
  # release was cut and `build` is skipped, yet the release PR still has to be
  # kept up to date; when a release *was* cut, `build` must have succeeded, or
  # there is no tag to anchor on and this would re-release the whole history.
  release-pr:
    needs: [release-please, build]
    if: always()
      && needs.release-please.result == 'success'
      && (needs.release-please.outputs.release_created != 'true'
      || needs.build.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write # open/update the release PR
    steps:
      # Same configuration as phase 1 — the two invocations must agree.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

version: 2
updates:
  # Keep GitHub Actions pinned versions fresh.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # Base images are pinned by digest, so a tag moving no longer reaches the
  # build. That is the point of the pin -- and the reason this entry is not
  # optional: without something bumping the digest, pinning trades a moving
  # base image for a stale one, which is the worse of the two.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # scoville itself has no runtime dependencies; this covers the [dev] extra
  # and docs/requirements.txt.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

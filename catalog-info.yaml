# Backstage catalog entry, read by paved's scorecard plugin.
#
# Every check paved scores is derived from this file alone — no cluster
# access, no CI credentials. What is absent here is absent from the score.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: scoville
  description: >-
      Risk posture for shell commands: score, blast radius and reversibility before you run them
  annotations:
    github.com/project-slug: fabiocicerchia/scoville
    backstage.io/source-location: url:https://github.com/fabiocicerchia/scoville/
    backstage.io/techdocs-ref: dir:.
  links:
    - url: https://github.com/fabiocicerchia/scoville
      title: Source
spec:
  type: library
  lifecycle: production
  owner: group:default/kodebeat
  system: oss-tools

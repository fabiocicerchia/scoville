site_name: scoville
site_description: "Risk posture for shell commands: score, blast radius and reversibility before you run them."
repo_url: https://github.com/fabiocicerchia/scoville
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}

nav:
  - Home: README.md
  - Architecture: architecture.md
  - Getting Started: getting-started.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
